<!doctype html>
<html lang="en"><head>
<meta name="google-site-verification" content="D-wzyNOrkVw7VYptcXQHz403H5gQETXrHiJTvmlHc2g" /><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d18"><title>SHOWTIME — Find your next favourite.</title>
<style>
:root{color-scheme:dark;--bg:#100d18;--panel:#1d1827;--red:#f0445e;--muted:#aaa1b4;--line:#393142}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px Inter,system-ui,sans-serif}header{position:sticky;top:0;z-index:3;background:#100d18ed;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:17px max(5vw,20px);display:flex;align-items:center;gap:25px}.logo{font-weight:900;font-size:22px;letter-spacing:-1px}.logo span{color:var(--red)}header input{flex:1;max-width:540px;background:#211b2b;border:1px solid var(--line);border-radius:10px;padding:12px 15px;color:white}select,button{background:#251e30;color:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px}button{cursor:pointer}button:hover{border-color:var(--red)}.hero{padding:55px max(5vw,20px) 35px;background:radial-gradient(ellipse at 75% 20%,#52213b 0%,#20152b 42%,var(--bg) 78%)}.eyebrow{color:#ff8493;font-size:11px;letter-spacing:.22em;font-weight:800}.hero h1{font-size:clamp(36px,6vw,64px);margin:12px 0;letter-spacing:-.05em}.hero p{color:#c4b8c9;max-width:550px;line-height:1.7}.wrap{padding:25px max(5vw,20px) 60px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}.filters select{min-width:135px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0}.sectionhead h2{font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:22px}.movie{min-width:0}.poster{height:250px;border-radius:13px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:inset 0 0 70px #0008;position:relative}.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 25%,#000b)}.poster>*{z-index:1}.poster b{font-size:11px;letter-spacing:.18em}.poster strong{font-size:27px;line-height:1.05;text-transform:uppercase;text-shadow:0 2px 12px #000}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:10px 0 7px}.movie h3{margin:0 0 10px;font-size:16px}.actions{display:flex;gap:7px}.actions button{flex:1;font-size:12px;padding:9px 5px}.primary{background:var(--red);border-color:var(--red);font-weight:700}.empty{color:var(--muted);padding:25px 0}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px;z-index:8}.modal.open{display:grid}.dialog{width:min(430px,100%);background:#211b2b;border:1px solid #51435d;border-radius:18px;padding:25px}.dialog h2{margin-top:0}.dialog label{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px}.dialog input,.dialog select{width:100%;padding:12px;border-radius:8px;background:#130f1b;color:white;border:1px solid var(--line)}.dialog .actions{margin-top:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#322744;border:1px solid #6b5685;padding:12px 20px;border-radius:99px;display:none;z-index:10}.toast.show{display:block}@media(max-width:560px){header{gap:10px;flex-wrap:wrap}header input{order:3;flex-basis:100%;max-width:none}.poster{height:225px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
</style></head><body>
<header><div class="logo">SHOW<span>TIME</span></div><input id="search" placeholder="Search movies…"><select id="city"><option>Hyderabad</option><option>Mumbai</option><option>Delhi</option><option>Bengaluru</option><option>Chennai</option><option>Seoul</option></select></header>
<section class="hero"><div class="eyebrow">YOUR NEXT NIGHT OUT STARTS HERE</div><h1>Lights. Camera.<br>Make memories.</h1><p>Discover stories worth watching. Explore the collection, find your vibe, and plan your next movie night.</p></section>
<main class="wrap"><div class="filters"><select id="genre"><option value="All">All genres</option><option>Action</option><option>Drama</option><option>Sci-Fi</option><option>Animation</option><option>Thriller</option></select><select id="language"><option value="All">All languages</option><option>English</option><option>Hindi</option><option>Japanese</option><option>Korean</option></select><select id="sort"><option value="featured">Featured</option><option value="rating">Top rated</option><option value="price">Price: low to high</option></select><button id="watchOnly">♡ Watchlist</button></div>
<div class="sectionhead"><h2 id="heading">Now showing</h2><span id="count" style="color:var(--muted)"></span></div><div class="grid" id="movies"></div></main>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Book tickets</h2><p style="color:var(--muted)">Choose a date, showtime and number of seats.</p><label>Date</label><input id="date" type="date"><label>Showtime</label><select id="time"><option>10:30 AM</option><option>1:45 PM</option><option>6:15 PM</option><option>9:30 PM</option></select><label>Tickets</label><input id="qty" type="number" min="1" max="10" value="2"><p id="total" style="font-size:20px;font-weight:700"></p><div class="actions"><button id="close">Cancel</button><button class="primary" id="confirm">Confirm demo booking</button></div></div></div><div class="toast" id="toast"></div>
<script>
const data=[
{title:'Beyond the Stars',genre:'Sci-Fi',lang:'English',rating:8.8,price:220,tag:'A NEW UNIVERSE',colors:['#183d63','#9b5baf']},
{title:'The Last Samurai',genre:'Action',lang:'Japanese',rating:9.1,price:250,tag:'HONOUR NEVER FADES',colors:['#8b263d','#e18b4e']},
{title:'Paper Hearts',genre:'Drama',lang:'Hindi',rating:8.2,price:180,tag:'A STORY OF US',colors:['#a94b68','#f3a77b']},
{title:'Neon Horizon',genre:'Thriller',lang:'Korean',rating:8.5,price:210,tag:'THE CITY IS WATCHING',colors:['#143d56','#7b55ad']},
{title:'Little Big World',genre:'Animation',lang:'Japanese',rating:9.0,price:190,tag:'DREAM WITHOUT LIMITS',colors:['#287c80','#f2ad68']},
{title:'Crimson Code',genre:'Action',lang:'English',rating:7.9,price:230,tag:'TRUST NO ONE',colors:['#721f32','#d16c42']},
{title:'Monsoon Letters',genre:'Drama',lang:'Hindi',rating:8.6,price:170,tag:'SOME THINGS STAY',colors:['#365b4c','#c39c69']},
{title:'Silent Orbit',genre:'Sci-Fi',lang:'Korean',rating:8.4,price:240,tag:'LOST IN INFINITY',colors:['#242b68','#a36ab2']}
];let saved=new Set(),active=null,onlySaved=false;const $=id=>document.getElementById(id);
function render(){let list=data.filter(m=>(m.title.toLowerCase().includes($('search').value.toLowerCase()))&&($('genre').value==='All'||m.genre===$('genre').value)&&($('language').value==='All'||m.lang===$('language').value)&&(!onlySaved||saved.has(m.title)));if($('sort').value==='rating')list.sort((a,b)=>b.rating-a.rating);if($('sort').value==='price')list.sort((a,b)=>a.price-b.price);$('heading').textContent=onlySaved?'Your watchlist':'Now showing';$('count').textContent=list.length+' titles';$('movies').innerHTML=list.length?list.map(m=>`<article class="movie"><div class="poster" style="background:radial-gradient(circle at 75% 20%,${m.colors[1]},transparent 55%),linear-gradient(145deg,${m.colors[0]},#100d18)"><b>SHOWTIME ORIGINAL</b><strong>${m.title}</strong><b>${m.tag}</b></div><div class="meta"><span>★ ${m.rating.toFixed(1)}</span><span>${m.lang} · ${m.genre}</span></div><h3>${m.title}</h3><div class="actions"><button class="primary" data-book="${m.title}">Book · ₹${m.price}</button><button data-save="${m.title}">${saved.has(m.title)?'♥ Saved':'♡ Save'}</button></div></article>`).join(''):'<div class="empty">No movies match those filters.</div>'}
['search','genre','language','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('watchOnly').onclick=()=>{onlySaved=!onlySaved;$('watchOnly').classList.toggle('primary',onlySaved);render()};$('movies').onclick=e=>{const b=e.target.closest('[data-book]'),s=e.target.closest('[data-save]');if(b)openBooking(b.dataset.book);if(s){saved.has(s.dataset.save)?saved.delete(s.dataset.save):saved.add(s.dataset.save);render()}};
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function openBooking(title){active=data.find(m=>m.title===title);$('modalTitle').textContent='Book '+title;$('date').min=new Date().toISOString().slice(0,10);$('date').value=$('date').min;$('qty').value=2;$('modal').classList.add('open');updateTotal()}
function updateTotal(){if(active)$('total').textContent='Total: ₹'+(active.price*Math.max(1,Math.min(10,+$('qty').value||1))).toLocaleString('en-IN')}
$('qty').oninput=updateTotal;$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('confirm').onclick=()=>{if(!$('date').value){toast('Please choose a date.');return}$('modal').classList.remove('open');toast('Demo booking confirmed for '+active.title+' · '+$('qty').value+' ticket(s). No payment or ticket issued.')};$('city').onchange=()=>toast('Showing sample listings for '+$('city').value);render();
</script></body></html>
